[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "robocode"
version = "0.1.0"
description = "Agents for robot physical reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
   "matplotlib",
   "numpy",
   "gymnasium",
   "pandas",
   "pandas-stubs",
   "hydra-core",
   "hydra-joblib-launcher",
   "omegaconf",
   "PyYAML",
   "kindergarden>=0.2.0",
   "pybullet-arm64>=3.2.8",
   "types-shapely",
   "scipy-stubs",
   "imageio",
   "imageio-ffmpeg",
   "mcp[cli]>=1.27,<2",
   "anthropic",
   "openai",
]

[project.optional-dependencies]
# Bilevel planning (SeSamE) baseline + the `bilevel_models` primitive. Kept
# optional so the agentic sandbox can OMIT it entirely for "models OFF" runs:
# its predicates/operators/controllers would otherwise leak task structure to
# the agent. Installed on the host via `uv sync --all-extras`; the sandbox only
# syncs `--extra bilevel` (and bind-mounts kinder-baselines) when the
# bilevel_models primitive is requested.
bilevel = [
    "bilevel_planning>=0.1.4",
    "kinder_bilevel_planning",
    "kinder_models",
]
# PDDLStream baseline on the kinder families that ship a PDDLStream domain
# (Packing3D). pddlstream is the PRPL packaged fork, whose install compiles
# FastDownward (needs make and a C++ compiler). Host only; never in the sandbox.
pddlstream = [
    "kinder_pddlstream_planning",
    "pddlstream",
]
tracker = [
    "gspread>=6.2,<7",
]
develop = [
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    # pytest 9.1 dropped the deprecated `path` arg from the pytest_collect_file
    # hookspec, which pytest-pylint 0.21.0 (its latest release) still declares,
    # so the --pylint plugin fails to register. Cap until pytest-pylint catches up.
    "pytest>=7.2.2,<9.1",
    "types-PyYAML",
]
libero = [
    "libero",
    "robosuite==1.4.0",
    "bddl==1.0.1",
    "robomimic==0.2.0",
    "gym==0.25.2",
    "mujoco",
    "future",
    "easydict",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robocode = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: opt-in live tests requiring external services and potentially paid model calls",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
py_version = 311
profile = "black"
# isort 7 classifies `_thread` as third-party and isort 9 as stdlib; CI floats to the
# latest, so pin the classification rather than let the two rewrite each other.
extra_standard_library = ["_thread"]
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*", "outputs/*", "third-party/*"]

[tool.uv.sources]
kindergarden = { path = "third-party/kindergarden", editable = true }
libero = { path = "third-party/LIBERO-PRO", editable = true }
kinder_bilevel_planning = { path = "third-party/kinder-baselines/kinder-bilevel-planning", editable = true }
kinder_models = { path = "third-party/kinder-baselines/kinder-models", editable = true }
kinder_pddlstream_planning = { path = "third-party/kinder-baselines/kinder-pddlstream-planning", editable = true }
# Full SHA so the VCS wheel (and its FastDownward build) is reused from the cache.
pddlstream = { git = "https://github.com/Princeton-Robot-Planning-and-Learning/pddlstream", rev = "5919a844b8c947acdb49bedb6e8b2b93e6a70c0c" }

[[tool.mypy.overrides]]
module = [
    "imageio_ffmpeg.*",
    "matplotlib.*",
    "pybullet.*",
    "pybullet_helpers.*",
    "pybullet_tools.*",
    "pybullet_utils.*",
    "pddlstream.*",
    "libero.*",
    "mujoco.*",
]
ignore_missing_imports = true
