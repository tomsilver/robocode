defaults:
  - approach: random
  - environment: small_maze
  - _self_

seed: 42
# Eval-suite seed; defaults to `seed`. Pin it to score different runs on one suite.
eval_seed: null
max_steps: 1000
num_eval_tasks: 100
# Per-instance eval wall-clock budget (seconds), shared by every approach.
eval_timeout: 30
render_videos: false
record_approach_history: false
# Evaluate each sandbox commit in the background during the run (full suite per commit).
live_approach_history: false
primitives:
  - check_action_collision
  - BiRRT
mcp_tools:
  - render_state
  - render_policy
