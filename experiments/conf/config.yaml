defaults:
  - approach: random
  - environment: small_maze
  - _self_

seed: 42
# Seed for the evaluation task suite. Unset, it follows `seed`, so every run is
# scored on its own draw. Pinning it makes separately-trained policies face an
# identical suite, which is what cross-evaluation between conditions requires.
eval_seed: null
max_steps: 1000
num_eval_tasks: 100
# Per-instance eval wall-clock budget (seconds), shared by every approach.
eval_timeout: 30
render_videos: false
record_approach_history: false
primitives:
  - check_action_collision
  - BiRRT
mcp_tools:
  - render_state
  - render_policy
