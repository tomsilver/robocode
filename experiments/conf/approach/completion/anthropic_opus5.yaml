provider: anthropic
model: claude-opus-5
api_key_env: ANTHROPIC_API_KEY
max_tokens: 32000  # max output tokens; generated code can be long
# Standard list prices (USD per 1M tokens) as of 2026-08, used to estimate
# cost_usd. Estimate only: no caching/batch/priority discounts applied.
input_cost_per_mtok: 5.0
output_cost_per_mtok: 25.0
