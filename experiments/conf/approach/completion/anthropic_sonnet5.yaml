provider: anthropic
model: claude-sonnet-5
api_key_env: ANTHROPIC_API_KEY
max_tokens: 32000  # max output tokens; generated code can be long
# Standard list prices (USD per 1M tokens) as of 2026-08, used to estimate
# cost_usd. Estimate only: no discounts, no $2/$10 intro rate (to 2026-08-31).
input_cost_per_mtok: 3.0
output_cost_per_mtok: 15.0
