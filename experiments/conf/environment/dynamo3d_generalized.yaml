# The registered variants are labelled o1 / o3 / o12 but place 1, 3 and 11 chairs;
# the wrapper only needs those numbers to be distinct, not to match the label.
_target_: robocode.environments.variable_object_count_env.VariableObjectCountEnv
constant_object_env_path: kinder.envs.dynamic3d.task_families:Dynamo3DEnv
count_kwarg: num_objects
count_object_prefix: obstacle_chair
design_counts: [1, 3]
eval_counts: [1, 3, 12]
constant_object_env_kwargs:
  scene_bg: false
base_steps: 400
steps_per_object: 400
