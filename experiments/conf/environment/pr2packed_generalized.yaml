# PDDLStream's `packed` with a varying block count.
#
# design_counts are what an approach is built against; eval_counts sweeps those plus
# held-out larger instances. The split is 1-3 design / 4-5 held out, chosen so that
# the held-out counts are exactly the 4 and 5 of the LLM-PDDLStream paper's
# `packed -n 3/4/5` sweep, and so that the design range starts low enough that a
# single-block instance is available for developing against. The plate holds at most
# 9 blocks (a 3x3 grid at the packing pitch), so 5 is not near the geometric ceiling.
_target_: robocode.environments.pr2_tamp_variable_count_env.PR2PackedVariableCountEnv
design_counts: [1, 2, 3]
eval_counts: [1, 2, 3, 4, 5]
