# PDDLStream's `packed` with a varying block count.
#
# design_counts controls unpinned reset sampling; eval_counts adds larger
# instances. Evaluation counts 4 and 5 match the LLM-PDDLStream paper's
# `packed -n 3/4/5` sweep. Unpinned resets also include single-block instances
# for development. The plate holds at most
# 9 blocks (a 3x3 grid at the packing pitch), so 5 is not near the geometric ceiling.
_target_: robocode.environments.pr2_tamp_variable_count_env.PR2PackedVariableCountEnv
design_counts: [1, 2, 3]
eval_counts: [1, 2, 3, 4, 5]
