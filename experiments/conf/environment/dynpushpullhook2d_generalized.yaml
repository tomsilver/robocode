# Dynamic PushPullHook2D with a variable obstruction count. The agent develops
# on the smaller scenes and is evaluated on the registered five-obstruction case.
_target_: robocode.environments.variable_object_count_env.VariableObjectCountEnv
constant_object_env_path: kinder.envs.dynamic2d.dyn_pushpullhook2d:DynPushPullHook2DEnv
count_kwarg: num_obstructions
count_object_prefix: obstruction
design_counts: [0, 1, 2, 3]
eval_counts: [0, 1, 2, 3, 5]
