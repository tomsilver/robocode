name: CI Checks

# Branches in this repo get CI on push; pull_request runs only for fork PRs.
on: [push, pull_request]

jobs:
  autoformat:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run black to test code linting
        uses: psf/black@stable
        with:
          options: "--check --verbose --exclude 'third-party|\\.venv|outputs'"
          jupyter: true
      - name: Run isort to organize imports
        uses: isort/isort-action@master
        with:
          configuration: "--skip third-party --skip .venv --skip outputs --check-only"
  linting:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - name: Install system libs
      run: |
        sudo apt-get update
        sudo apt-get install -y liblapack-dev libblas-dev libegl1 libgl1 libglu1-mesa
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install the project
      run: uv sync --all-extras --dev
    - name: Lint
      run: |
        uv run pytest . --pylint -m pylint --pylint-rcfile=.pylintrc --ignore=third-party --ignore=outputs
  static-type-checking:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install the project
      run: uv sync --all-extras --dev
    - name: Mypy
      run: |
        uv run mypy . --exclude third-party --exclude outputs
  unit-tests:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
    - name: Install system libs
      run: |
        sudo apt-get update
        sudo apt-get install -y liblapack-dev libblas-dev libegl1 libgl1 libglu1-mesa
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install the project
      run: uv sync --all-extras --dev
    - name: Pytest
      run: |
       uv run pytest tests/
